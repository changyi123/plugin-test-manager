app:
  key: test_manager
  uuid: bf73e61c-e15a-4461-a1f7-f940c2009332
  name: test_manager
  version: "3.2.0"
modules:
  webtrigger:
    # TODO: Debug 使用，生产环境禁止调用西面的 trigger
    # ---------------------------------------------
    - key: test-manager-initial-script
      function: test-manager-initial-script
    # ---------------------------------------------
    # 动态配置 one 路由
    - key: gitee-menus
      function: gitee-menus
    - key: create-chart-groups
      function: create-chart-groups
    - key: huishang-script
      function: huishang-script
    - key: shenwan-script
      function: shenwan-script
    - key: report-stats
      function: report-stats
    - key: report-data-base
      function: report-data-base
    - key: report-data-extensions-huishang
      function: report-data-extensions-huishang
    - key: report-data-extensions-inspur
      function: report-data-extensions-inspur
      # 查询实体数据
    - key: api-query-test-entity
      function: api-query-test-entity
    - key: api-query-linked-test-entity
      function: api-query-linked-test-entity
    # 批量操作（删除，更新，创建测试执行）
    - key: api-batch-delete
      function: api-batch-delete
    - key: api-batch-update
      function: api-batch-update
    - key: api-batch-create-test-run
      function: api-batch-create-test-run
    # 数据统计
    - key: api-stats-test-plan
      function: api-stats-test-plan
    - key: api-stats-test-execution
      function: api-stats-test-execution
    - key: api-stats-test-case
      function: api-stats-test-case
    # 模块代码
    - key: api-module-repository-tree
      function: api-module-repository-tree

  trigger:
    - key: test-manager-initial-script-update
      events:
        # 使用 update trigger 暂时替代
        # - proxima:app:install
        - proxima:app:update
      function: test-manager-initial-script
    - key: test-manager-initial-script-install
      events:
        - proxima:app:install
        - proxima:app:upgrade
      function: test-manager-initial-script
  function:
    - key: gitee-menus
      handler: web.runGiteeMenus
    - key: create-chart-groups
      handler: web.createChartGroups
    - key: test-manager-initial-script
      handler: trigger.runInitialScript
    - key: test-manager-validate-script
      handler: importer.runValidate
    - key: test-manager-import-script
      handler: importer.runImport
      # 5 分钟超时时长
      timeout: 300000
    - key: huishang-script
      handler: web.runHuishangScript
    - key: shenwan-script
      handler: web.runShenWanScript
      # 测试报告统计数据
    - key: report-stats
      handler: web.requestReportStats
      # 测试报告模板基础数据
    - key: report-data-base
      handler: web.requestReportDataBase
      # 徽商测试报告拓展数据
    - key: report-data-extensions-huishang
      handler: web.requestReportHuiShangDataExtensions
      # 浪潮测试报告拓展数据
    - key: report-data-extensions-inspur
      handler: web.requestReportInspurDataExtensions

      # api backend Query
    - key: api-query-test-entity
      handler: api.queryTestEntity
    - key: api-query-linked-test-entity
      handler: api.queryLinkedTestEntity

     # api batch
    - key: api-batch-delete
      handler: api.batchDelete
      timeout: 90000
    - key: api-batch-update
      handler: api.batchUpdate
      # 5 分钟超时时长
      timeout: 300000
    - key: api-batch-create-test-run
      handler: api.batchCreateTestRun
      # 5 分钟超时时长
      timeout: 300000

    # api stats
    - key: api-stats-test-plan
      handler: api.testPlanStats
    - key: api-stats-test-execution
      handler: api.testExecutionStats
    - key: api-stats-test-case
      handler: api.testCaseStats

    # api module
    - key: api-module-repository-tree
      handler: api.repositoryTree

  itemPanel:
    - key: test-manager-test-detail
      resource: main
      title: 测试管理
      loadType: Micro
      route: /panelModule
      defaultActive: true
  adminPage:
    - key: test-config
      resource: main
      title: 测试管理配置
      loadType: Micro
      route: /config
  workspacePage:
    - key: test-plan
      resource: main
      title: 测试计划
      loadType: Micro
      route: /plan
      {workspacePageHidden}
    - key: test-repository
      resource: main
      title: 测试用例库
      loadType: Micro
      route: /repository
      {workspacePageHidden}
    # - key: main-test-plan
    #   resource: main
    #   title: 测试计划
    #   loadType: Micro
    #   route: /testPlan
    #   hidden: true
    # - key: main-test-repository
    #   resource: main
    #   title: 测试用例库
    #   loadType: Micro
    #   route: /repository
    #   hidden: true
  beforeCreateOrUpdateModal:
    - key: before-create-or-update-modal
      resource: main
      title: 新建事项
      loadType: Micro
      route: /beforeItemCreateModule
  importer:
    function: test-manager-import-script
    validate: test-manager-validate-script
    itemFields:
      - key: group
        title: 所属分组
      # - key: priority
      #   title: 优先级
      - key: precondition
        title: 前置条件
      - key: action
        title: 步骤描述
      - key: result
        title: 预期结果
      - key: data
        title: 数据
  # 初始化 dataType 为 object， array 的数据类型
  customFieldType:
    - key: es_object
      name: 测试管理基础字段类型（对象）
      description: 测试管理基础字段类型（勿删改）
      dataType: object
    - key: es_array_keyword
      # 字符串数组，keyword 可以使用 es keyword 类型查询
      name: 测试管理基础字段类型（字符串数组）
      description: 测试管理基础字段类型（勿删改）
      dataType: array
    - key: es_text_keyword
      # 字符串数组，keyword 可以使用 es keyword 类型查询
      name: 测试管理基础字段类型（字符串）
      description: 测试管理基础字段类型（勿删改）
      dataType: text
  customField:
      # 描述关联关系的配置（使用事项关联不需要处理）
    - key: linkType
      name: test_manager_linkType
      description: 测试管理内置字段-测试关联类型（勿删改）
      # Enum 关联关系维护在被关联方
      # 1. 测试用例关联计划（N:1）           CaseLinkPlan
      # 2. 测试执行关联测试执行任务（N:1）    RunLinkExecution
      # 3. 测试执行任务关联测试计划（N:1）    ExecutionLinkPlan
      type: _self:es_text_keyword
    - key: linkItems
      name: test_manager_linkItems
      description: 测试管理内置字段-测试关联项（勿删改）
      type: _self:es_array_keyword
    - key: status
      name: test_manager_status
      description: 测试管理内置字段-测试执行状态（勿删改）
      type: _self:es_text_keyword
    - key: referenceCase
      name: test_manager_referenceCase
      description: 测试管理内置字段-测试用例引用（勿删改）
      type: _self:es_text_keyword
    - key: type
      description: 测试管理内置字段-测试管理类型（勿删改）
      name: test_manager_type
      type: _self:es_text_keyword
    - key: caseStatus
      name: test_manager_caseStatus
      description: 测试管理内置字段-用例最新执行状态（勿删改）
      type: _self:es_object
    - key: repository
      name: test_manager_repository
      description: 测试管理内置字段-测试用例库模块（勿删改）
      type: _self:es_text_keyword
    - key: designee
      name: test_manager_designee
      description: 测试管理内置字段-测试执行人（勿删改）
      type: User
    - key: executor
      name: test_manager_executor
      description: 测试管理内置字段-测试最新执行人（勿删改）
      type: User
    - key: sortIndex
      name: test_manager_sortIndex
      description: 测试管理内置字段-测试用例排序索引（勿删改）
      type: Number
    # 下面字段也保存入 es，方便 iql 直接查询。以字符串类型存储。防止 es 创建索引时定义默认类型，防止后续更新是出现类型错误
    - key: detail
      name: test_manager_detail
      description: 测试管理内置字段-测试用例详情（勿删改）
      type: Text
    - key: runDetail
      name: test_manager_runDetail
      description: 测试管理内置字段-测试执行详情（勿删改）
      type: Text
    - key: comment
      name: test_manager_comment
      description: 测试管理内置字段-测试执行评论（勿删改）
      type: Text
  customItemType:
    - key: test_manager_detail
      name: 测试用例
      icon: /icons/Issue_Story.svg
      description: 测试管理类型-测试用例
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
            - fieldBehavior
          plugin:
            - testManager
        displayContext: test_manager
    - key: test_manager_plan
      name: 测试计划
      icon: /icons/Issue_Plan.svg
      description: 测试管理类型-测试计划
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
            - fieldBehavior
          plugin:
            - testManager
        displayContext: test_manager
    - key: test_manager_execution
      name: 测试执行任务
      icon: /icons/Issue_Approval.svg
      description: 测试管理类型-测试执行任务
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
            - fieldBehavior
          plugin:
            - testManager
        displayContext: test_manager
    # 测试执行事项类型，所有测试执行都是用该事项类型
    - key: test_manager_run
      name: 测试执行（内置）
      icon: /icons/Issue_Task.svg
      description: 测试管理类型-测试执行
      displayConditions:
        displayModules:
          plugin:
            - testManager
        displayContext: test_manager
tables:
  - className: Repository
    fields:
      name:
        type: String
      workspaceKey:
        type: String
      parent:
        type: Pointer
        isAppClass: true
        targetClass: Repository
      # deprecated 使用 Test 表的 repository 替代
      # testDetailIds:
      #   type: Array
      sortIndex:
        type: Number
  - className: TestConfig
    fields:
      workspaceKey:
        type: String
      isolateTestType:
        type: Array
      itemTypeMap:
        type: Object
      defectsMapping:
        type: Array
      testRunAction:
        type: Object
      global:
        type: Boolean
      extra:
        type: Object
      tableFields:
        type: Object
      # 关联的缺陷面板 pointer
      # defectBoard:
      #   type: Pointer
      #   targetClass: Board
      # 控制缺陷面板是否显示，默认为 true
      # displayDefectBoard:
      #   type: Boolean
      # 关联统计报表
      chartGroups:
        type: Object
  - className: TestRelation
    fields:
      from:
        type: Pointer
        isAppClass: true
        targetClass: Test
      to:
        type: Pointer
        isAppClass: true
        targetClass: Test
      createdBy:
        type: Pointer
        targetClass: _User
      updatedBy:
        type: Pointer
        targetClass: _User
      relationType:
        type: String
  - className: WordTemplate
    fields:
      name:
        type: String
      file:
        type: Object
      # enable:
      #   type: Boolean
      # command:
      #   type: Array
  - className: UserSetting
    fields:
      filterFields:
        type: Object
      workspace:
        type: Pointer
        targetClass: Workspace
      user:
        type: Pointer
        targetClass: _User
resources:
  - key: main
    path: ./src/dist
