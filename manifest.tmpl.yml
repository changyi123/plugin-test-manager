app:
  key: test_manager
  uuid: bf73e61c-e15a-4461-a1f7-f940c2009332
  name: test_manager
  version: "0.0.120"
modules:
  webtrigger:
    # 动态配置 one 路由
    - key: gitee-menus
      function: gitee-menus
    - key: huishang-script
      function: huishang-script
    - key: report-stats
      function: report-stats
    - key: report-data-base
      function: report-data-base
    - key: report-data-extensions-huishang
      function: report-data-extensions-huishang
      # 查询实体数据
    - key: api-query-test-entity
      function: api-query-test-entity
  trigger:
    - key: test-manager-initial-script-update
      events:
        # 使用 update trigger 暂时替代
        # - proxima:app:install
        - proxima:app:update
      function: test-manager-initial-script
    - key: test-manager-initial-script-install
      events:
        - proxima:app:install
      function: test-manager-initial-script
  function:
    - key: gitee-menus
      handler: web.runGiteeMenus
    - key: test-manager-initial-script
      handler: trigger.runInitialScript
    - key: test-manager-validate-script
      handler: importer.runValidate
    - key: test-manager-import-script
      handler: importer.runImport
    - key: huishang-script
      handler: web.runHuishangScript
      # 测试报告统计数据
    - key: report-stats
      handler: web.requestReportStats
      # 测试报告模板基础数据
    - key: report-data-base
      handler: web.requestReportDataBase
      # 测试报告拓展数据
    - key: report-data-extensions-huishang
      handler: web.requestReportDataExtensionsBase

    - key: api-query-test-entity
      handler: api.queryTestEntity

  itemPanel:
    - key: test-manager-test-detail
      resource: main
      title: 测试管理
      loadType: Micro
      route: /panelModule
  adminPage:
    - key: test-config
      resource: main
      title: 测试管理配置
      loadType: Micro
      route: /config
  workspacePage:
    - key: test-plan
      resource: main
      title: 测试计划
      loadType: Micro
      route: /plan
      {workspacePageHidden}
    - key: test-repository
      resource: main
      title: 测试用例库
      loadType: Micro
      route: /repository
      {workspacePageHidden}
    # - key: main-test-plan
    #   resource: main
    #   title: 测试计划
    #   loadType: Micro
    #   route: /testPlan
    #   hidden: true
    # - key: main-test-repository
    #   resource: main
    #   title: 测试用例库
    #   loadType: Micro
    #   route: /repository
    #   hidden: true
  beforeCreateOrUpdateModal:
    - key: before-create-or-update-modal
      resource: main
      title: 新建事项
      loadType: Micro
      route: /beforeItemCreateModule
  importer:
    function: test-manager-import-script
    validate: test-manager-validate-script
    itemFields:
      - key: group
        title: 所属分组
      # - key: priority
      #   title: 优先级
      - key: precondition
        title: 前置条件
      - key: action
        title: 步骤描述
      - key: result
        title: 预期结果
      - key: data
        title: 数据
  # 初始化 dataType 为 object， array 的数据类型
  customFieldType:
    - key: plain_object
      name: 测试管理基础字段类型（对象）
      description: 测试管理基础字段类型（勿删改）
      dataType: object
    - key: plain_array
      name: 测试管理基础字段类型（数组）
      description: 测试管理基础字段类型（勿删改）
      dataType: array
  customField:
      # 描述关联关系的配置（使用事项关联不需要处理）
    - key: linkType
      name: 测试关联类型
      linkedCase: 
      description: 测试管理内置自定义字段（勿删改）
      # Enum 关联关系维护在被关联方
      # 1. 测试用例关联计划（N:1）           CaseLinkPlan
      # 2. 测试执行关联测试执行任务（N:1）    RunLinkExecution
      # 3. 测试执行任务关联测试计划（N:1）    ExecutionLinkPlan
      type: Text
    - key: linkItems
      name: 测试关联项
      description: 测试管理内置自定义字段（勿删改）
      type: _self:plain_array
    - key: status
      name: 测试执行状态
      description: 测试管理内置自定义字段（勿删改）
      type: Text
    - key: referenceCase
      name: 测试用例引用
      description: 测试管理内置自定义字段（勿删改）
      type: Text
    - key: type
      description: 测试管理内置自定义字段（勿删改）
      name: 测试类型
      type: Text
    - key: caseStatus
      name: 用例最新执行状态
      description: 测试管理内置自定义字段（勿删改）
      type: _self:plain_object
    - key: repository
      name: 测试用例库模块
      description: 测试管理内置自定义字段（勿删改）
      type: Text
    - key: repository
      name: 测试用例库分组
      description: 测试管理内置自定义字段（勿删改）
      type: Text
    - key: designee
      name: 测试负责人
      description: 测试管理内置自定义字段（勿删改）
      type: User
    - key: executor
      name: 测试最新执行人
      description: 测试管理内置自定义字段（勿删改）
      type: User
    - key: sortIndex
      name: 测试用例排序索引
      description: 测试管理内置自定义字段（勿删改）
      type: Number
  customItemType:
    - key: test_manager_detail
      name: 测试用例
      icon: /icons/Issue_Story.svg
      description: 测试管理类型-测试用例
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
          plugin:
            - testManager
        displayContext: test_manager
    - key: test_manager_plan
      name: 测试计划
      icon: /icons/Issue_Plan.svg
      description: 测试管理类型-测试计划
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
          plugin:
            - testManager
        displayContext: test_manager
    - key: test_manager_execution
      name: 测试执行任务
      icon: /icons/Issue_Approval.svg
      description: 测试管理类型-测试执行任务
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
          plugin:
            - testManager
        displayContext: test_manager
    # 测试执行事项类型，所有测试执行都是用该事项类型
    - key: test_manager_run
      name: 测试执行
      description: 测试管理类型-测试执行
      displayConditions:
        displayModules:
          plugin:
            - testManager
        displayContext: test_manager
tables:
  - className: Repository
    fields:
      name:
        type: String
      workspaceKey:
        type: String
      parent:
        type: Pointer
        isAppClass: true
        targetClass: Repository
      # deprecated 使用 Test 表的 repository 替代
      # testDetailIds:
      #   type: Array
      sortIndex:
        type: Number
  - className: TestConfig
    fields:
      workspaceKey:
        type: String
      isolateTestType:
        type: Array
      itemTypeMap:
        type: Object
      defectsMapping:
        type: Array
      global:
        type: Boolean
      extra:
        type: Object
  - className: TestRelation
    fields:
      from:
        type: Pointer
        isAppClass: true
        targetClass: Test
      to:
        type: Pointer
        isAppClass: true
        targetClass: Test
      createdBy:
        type: Pointer
        targetClass: _User
      updatedBy:
        type: Pointer
        targetClass: _User
      relationType:
        type: String
  - className: WordTemplate
    fields:
      name:
        type: String
      file:
        type: Object
      # enable:
      #   type: Boolean
      # command:
      #   type: Array
resources:
  - key: main
    path: ./src/dist