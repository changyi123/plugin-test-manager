    test-repository:
      title: 测试用例库
    test-stats-report:
      title: 测试概览
    before-create-or-update-modal:
      title: 新建事项
    test-report:
      title: 测试报告
    test-task:
      title: 测试执行任务
    test-xmindimport:
      title: xmind 数据导入
    basic-test-manager-global-filter:
      name: 全局筛选-测试管理
