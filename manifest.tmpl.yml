app:
  key: test_manager
  uuid: bf73e61c-e15a-4461-a1f7-f940c2009332
  name: test_manager
  version: "4.22.0"
modules:
  webtrigger:
    # TODO: Debug 使用，生产环境禁止调用下面的 trigger
    # ---------------------------------------------
    - key: test-manager-initial-script
      function: test-manager-initial-script-function
    # ---------------------------------------------
    # 动态配置 one 路由
    - key: gitee-menus
      function: gitee-menus-function
    # 批量创建统计报表
    - key: batch-create-chart-groups
      function: batch-create-chart-groups-function
    # 徽商工作流脚本
    - key: huishang-script
      function: huishang-script-function
    # 申万工作流脚本
    - key: shenwan-script
      function: shenwan-script-function
    # 拖拽排序生成测试用例 sortIndex
    - key: generate-sortIndex
      function: generate-sortIndex-function
    # 测试管理脑图接口
    - key: api-module-minder-data-import
      function: api-module-minder-data-import-function
    - key: api-query-minder-data
      function: api-query-minder-data-function
    - key: report-stats
      function: report-stats-function
    - key: report-data-base
      function: report-data-base-function
    - key: report-data-extensions-huishang
      function: report-data-extensions-huishang-function
    - key: report-data-extensions-inspur
      function: report-data-extensions-inspur-function
    # CFCA测试用例重名校验接口
    - key: check-duplicate-case
      function: check-duplicate-case-function
      # 查询实体数据
    - key: api-query-test-entity
      function: api-query-test-entity-function
    - key: api-query-linked-test-entity
      function: api-query-linked-test-entity-function
    - key: api-query-case-by-status
      function: api-query-case-by-status-function
    - key: api-query-case-run-record
      function: api-query-case-run-record-function
    # 批量操作（删除，更新，创建测试执行）
    - key: api-batch-delete
      function: api-batch-delete-function
    - key: api-batch-delete-v2
      function: api-batch-delete-v2-function
    - key: api-batch-update
      function: api-batch-update-function
    - key: api-batch-update-value
      function: api-batch-update-value-function
    - key: api-batch-create-test-run
      function: api-batch-create-test-run-function
    - key: api-batch-create-test-case
      function: api-batch-create-test-case-function
    - key: api-batch-copy-test-case
      function: api-batch-copy-test-case-function
    - key: api-batch-copy-test-case-v2
      function: api-batch-copy-test-case-v2-function
    - key: api-batch-link-test-execution-to-test-plan
      function: api-batch-link-test-execution-to-test-plan-function
    # 数据统计
    - key: api-stats-test-plan
      function: api-stats-test-plan-function
    - key: api-stats-test-execution
      function: api-stats-test-execution-function
    - key: api-stats-test-case
      function: api-stats-test-case-function
    - key: api-count-test
      function: api-count-test-function
    # 模块代码
    - key: api-module-repository-tree
      function: api-module-repository-tree-function
    - key: api-module-repository-tree-v2
      function: api-module-repository-tree-v2-function

    # 发送消息
    - key: api-send-message
      function: api-send-message-function

    # 定制化代码
    # 获取查询测试报告
    - key: api-query-test-report
      function: api-query-test-report-function

    - key: api-generate-offline-report
      function: api-generate-offline-report-function
    
    # 申万测试报告联调对接
    - key: extension-report-shenwan
      function: extension-report-shenwan-function
    
    - key: extension-weichai-file-encrypt
      function: extension-weichai-file-encrypt-function

    # 测试管理初始化脚本
    - key: init-test-config
      function: init-test-config-function

    # 基础数据合并接口
    - key: api-query-basic-data
      function: api-query-basic-data-function

  trigger:
    - key: test-manager-initial-script-install
      events:
        - proxima:app:install
        - proxima:app:upgrade
      function: test-manager-initial-script-function
      # 5 分钟超时时长
      timeout: 300000
    - key: item-delete-trigger
      events:
        - gei:proxima:item:beforeDelete
      function: item-delete-trigger-function
      # 5 分钟超时时长
      timeout: 300000
    - key: item-created-trigger
      events:
        - gei:proxima:item:created
      function: item-created-trigger-function
      # 5 分钟超时时长
      timeout: 300000
    - key: workspace-create-trigger
      events:
        - gei:proxima:workspace:created
      function: workspace-create-trigger-function
    - key: workspace-bind-trigger
      events:
        - gei:apps:bound:workspace
      function: workspace-bind-trigger-function
    
  function:
    - key: gitee-menus-function
      handler: web.runGiteeMenus
    - key: batch-create-chart-groups-function
      handler: web.batchCreateChartGroups
    - key: test-manager-initial-script-function
      handler: trigger.runInitialScript
    - key: item-delete-trigger-function
      handler: trigger.deleteTestLink
    - key: item-created-trigger-function
      handler: trigger.createdItemLinkType
    - key: test-manager-validate-script-function
      handler: importer.runValidate
    - key: test-manager-before-import-script-function
      handler: importer.runBeforeImport
    - key: test-manager-import-script-function
      handler: importer.runImport
    - key: workspace-create-trigger-function
      handler: trigger.workspaceCreated
    - key: workspace-bind-trigger-function
      handler: trigger.workspaceBind
      # 5 分钟超时时长
      timeout: 300000
    - key: huishang-script-function
      handler: web.runHuishangScript
    - key: shenwan-script-function
      handler: web.runShenWanScript
    - key: generate-sortIndex-function
      handler: web.generateSortIndex
      # 测试报告统计数据
    - key: report-stats-function
      handler: web.requestReportStats
      # 测试报告模板基础数据
    - key: report-data-base-function
      handler: web.requestReportDataBase
      # 徽商测试报告拓展数据
    - key: report-data-extensions-huishang-function
      handler: web.requestReportHuiShangDataExtensions
      # 浪潮测试报告拓展数据
    - key: report-data-extensions-inspur-function
      handler: web.requestReportInspurDataExtensions
     # cfca测试用例重名用例校验
    - key: check-duplicate-case-function
      handler: web.checkDuplicateCase
      timeout: 90000
      # api backend Query
    - key: api-query-test-entity-function
      handler: query.queryTestEntity
    - key: api-query-linked-test-entity-function
      handler: api.queryLinkedTestEntity
    - key: api-query-case-by-status-function
      handler: api.queryCaseIdByStatus
    - key: api-query-case-run-record-function
      handler: api.queryCaseRunRecords

     # api batch
    - key: api-batch-delete-function
      handler: api.batchDelete
      timeout: 300000
     # api batch
    - key: api-batch-delete-v2-function
      handler: api.batchDeleteV2
      timeout: 300000
    - key: api-batch-update-function
      handler: api.batchUpdate
      # 5 分钟超时时长
      timeout: 300000
    - key: api-batch-update-value-function
      handler: api.batchUpdateValue
      # 5 分钟超时时长
      timeout: 300000
    - key: api-batch-create-test-run-function
      handler: api.batchCreateTestRun
      # 5 分钟超时时长
      timeout: 300000
    - key: api-batch-create-test-case-function
      handler: api.batchCreateTestCase
      # 5 分钟超时时长
      timeout: 300000
    - key: api-batch-copy-test-case-function
      handler: api.batchCopyTestCase
      # 5 分钟超时时长
      timeout: 300000
    - key: api-batch-copy-test-case-v2-function
      handler: api.batchCopyTestCaseV2
      # 5 分钟超时时长
      timeout: 300000
    - key: api-batch-link-test-execution-to-test-plan-function
      handler: api.linkTestExecuteToTestPlan
      timeout: 300000

    # api stats
    - key: api-stats-test-plan-function
      handler: query.testPlanStats
    - key: api-stats-test-execution-function
      handler: api.testExecutionStats
    - key: api-stats-test-case-function
      handler: api.testCaseStats
    - key: api-count-test-function
      handler: api.testCount

    # api module
    - key: api-query-basic-data-function
      handler: query.queryBasicData
    - key: api-module-repository-tree-function
      handler: api.repositoryTree
    - key: api-module-repository-tree-v2-function
      handler: api.repositoryTreeV2
    - key: api-query-minder-data-function
      handler: api.minderData
    - key: api-module-minder-data-import-function
      handler: api.minderDataImport
      # 5 分钟超时时长
      timeout: 300000

    - key: api-send-message-function
      handler: api.sendMessage

    - key: api-query-test-report-function
      handler: api.queryTestReport

    - key: api-generate-offline-report-function
      handler: api.generateOfflineReport

    - key: extension-report-shenwan-function
      handler: api.shenwanTestReportInfo

    - key: extension-weichai-file-encrypt-function
      handler: api.weichaiFileEncrypt

    - key: init-test-config-function
      handler: api.initTestConfig

  itemPanel:
    - key: test-manager-test-detail
      resource: main
      title: 测试管理
      loadType: Micro
      route: /panelModule
      defaultActive: false
  adminPage:
    - key: test-config
      resource: main
      title: 测试管理配置
      loadType: Micro
      route: /config
  workspacePage:
    - key: test-plan
      resource: main
      title: 测试计划
      loadType: Micro
      route: /plan
      icon: /main/icons/Panel_Testplan.svg
      activeIcon: /main/icons/Panel_TestplanB.svg
      displayInBoardManage: true
      {workspacePageHidden}
    - key: test-task
      resource: main
      title: 测试执行任务
      loadType: Micro
      route: /task
      displayInBoardManage: true
      {workspacePageHidden}
    - key: test-repository
      resource: main
      title: 测试用例库
      loadType: Micro
      route: /repository
      icon: /main/icons/Panel_Testcase.svg
      activeIcon: /main/icons/Panel_TestcaseB.svg
      displayInBoardManage: true
      {workspacePageHidden}
    - key: test-report
      resource: main
      title: 测试报告
      loadType: Micro
      route: /report
      displayInBoardManage: true
      {workspacePageHidden}
    - key: test-stats-report
      resource: main
      title: 测试概览
      loadType: Redirect
      icon: /main/icons/Panel_Test.svg
      activeIcon: /main/icons/Panel_TestB.svg
      route: /[tenant]/workspaces/[workspace]/plugin/team_insight_charts_base_team_insight_test_manager?disabledCreate=true&displayContext=test_manager&moduleKey=test_manager
      displayInBoardManage: true
      {workspacePageHidden}
    - key: test-xmindimport
      resource: main
      title: 测试管理脑图数据导入
      loadType: Micro
      route: /xmindImport
      hidden: true
  appPage:
    - key: test-report-creator
      resource: main
      title: 测试管理模板创建
      loadType: Micro
      route: /reportCreator
      hidden: true
    - key: test-report-view
      resource: main
      title: 测试报告预览
      loadType: Micro
      route: /reportView
      hidden: true
  beforeCreateOrUpdateModal:
    - key: before-create-or-update-modal
      resource: main
      title: 新建事项
      loadType: Micro
      route: /beforeItemCreateModule

  importer:
    # function: test-manager-import-script-function
    function: test-manager-before-import-script-function
    validate: test-manager-validate-script-function
    itemFields:
      - key: group
        title: importer.itemFields.group
      # - key: priority
      #   title: 优先级
      - key: precondition
        title: importer.itemFields.precondition
      - key: action
        title: importer.itemFields.action
      - key: result
        title: importer.itemFields.result
      - key: data
        title: importer.itemFields.data
  # 初始化 dataType 为 object， array 的数据类型
  customFieldType:
    - key: es_object
      name: 测试管理基础字段类型（对象）
      description: 测试管理基础字段类型（勿删改）
      dataType: object
    - key: es_array_keyword
      # 字符串数组，keyword 可以使用 es keyword 类型查询
      name: 测试管理基础字段类型（字符串数组）
      description: 测试管理基础字段类型（勿删改）
      dataType: array
    - key: es_text_keyword
      # 字符串数组，keyword 可以使用 es keyword 类型查询
      name: 测试管理基础字段类型（字符串）
      description: 测试管理基础字段类型（勿删改）
      dataType: text
  customField:
      # 描述关联关系的配置（使用事项关联不需要处理）
    - key: linkType
      name: test_manager_linkType
      description: 测试管理内置字段-测试关联类型（勿删改）
      # Enum 关联关系维护在被关联方
      # 1. 测试用例关联计划（N:1）           CaseLinkPlan
      # 2. 测试执行关联测试执行任务（N:1）    RunLinkExecution
      # 3. 测试执行任务关联测试计划（N:1）    ExecutionLinkPlan
      type: _self:es_text_keyword
    - key: linkItems
      name: test_manager_linkItems
      description: 测试管理内置字段-测试关联项（勿删改）
      type: _self:es_array_keyword
    - key: status
      name: test_manager_status
      description: 测试管理内置字段-测试执行状态（勿删改）
      type: _self:es_text_keyword
    - key: referenceCase
      name: test_manager_referenceCase
      description: 测试管理内置字段-测试用例引用（勿删改）
      type: _self:es_text_keyword
    - key: type
      description: 测试管理内置字段-测试管理类型（勿删改）
      name: test_manager_type
      type: _self:es_text_keyword
    - key: caseStatus
      name: test_manager_caseStatus
      description: 测试管理内置字段-用例最新执行状态（勿删改）
      type: _self:es_object
    - key: caseExecutor
      name: test_manager_caseExecutor
      description: 测试管理内置字段-用例最新执行人（勿删改）
      type: _self:es_object
    - key: caseRun
      name: test_manager_caseRun
      description: 测试管理内置字段-用例最新执行的测试执行（勿删改）
      type: _self:es_object
    - key: repository
      name: test_manager_repository
      description: 测试管理内置字段-测试用例库模块（勿删改）
      type: _self:es_text_keyword
    - key: designee
      name: test_manager_designee
      description: 测试管理内置字段-测试执行人（勿删改）
      type: User
    - key: executor
      name: test_manager_executor
      description: 测试管理内置字段-测试最新执行人（勿删改）
      type: User
    - key: sortIndex
      name: test_manager_sortIndex
      description: 测试管理内置字段-测试用例排序索引（勿删改）
      type: Number
    - key: executeCount
      name: test_manager_executeCount
      description: 测试管理内置字段-测试执行状态执行通过或者失败统计次数（勿删改）
      type: Number
    - key: executeTime
      name: test_manager_executeTime
      description: 测试管理内置字段-测试执行执行时间（勿删改）
      type: Date
    # 下面字段也保存入 es，方便 iql 直接查询。以字符串类型存储。防止 es 创建索引时定义默认类型，防止后续更新是出现类型错误
    - key: detail
      name: test_manager_detail
      description: 测试管理内置字段-测试用例详情（勿删改）
      type: Text
    - key: runDetail
      name: test_manager_runDetail
      description: 测试管理内置字段-测试执行详情（勿删改）
      type: Text
    - key: comment
      name: test_manager_comment
      description: 测试管理内置字段-测试执行评论（勿删改）
      type: Text
  customItemType:
    - key: test_manager_detail
      name: 测试用例
      icon: /icons/Issue_Story.svg
      description: 测试管理类型-测试用例
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
            - fieldBehavior
          plugin:
            - testManager
        displayContext: test_manager
    - key: test_manager_plan
      name: 测试计划
      icon: /icons/Issue_Plan.svg
      description: 测试管理类型-测试计划
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
            - fieldBehavior
          plugin:
            - testManager
        displayContext: test_manager
    - key: test_manager_execution
      name: 测试执行任务
      icon: /icons/Issue_Approval.svg
      description: 测试管理类型-测试执行任务
      displayConditions:
        displayModules:
          adminPage:
            - automation
            - itemType
            - hierarchy
            - linkType
            - screenScheme
            - workflowScheme
            - fieldBehavior
          plugin:
            - testManager
        displayContext: test_manager
    # 测试执行事项类型，所有测试执行都是用该事项类型
    - key: test_manager_run
      name: 测试执行（内置）
      icon: /icons/Issue_Task.svg
      description: 测试管理类型-测试执行
      displayConditions:
        displayModules:
          plugin:
            - testManager
        displayContext: test_manager
  chart:
    - key: combined-components
      resource: combined-components
      name: combined-components
      loadType: RemoteJs
      description: combined-components
      tabOrder: 1
      grid:
        w: 4
        h: 3
        minW: 1
        maxW: 12
        minH: 1
      icon: data:image/png;base64,
    - key: basic-test-manager-global-filter
      resource: combined-components
      name: 全局筛选-测试管理
      description: 提供实时类型报表全局筛选功能
      loadType: RemoteJs
      enableSave: true
      tabOrder: 1
      type: 自定义
      grid:
        w: 12
        h: 2
        minW: 1
        maxW: 12
        minH: 1
      icon: data:image/svg+xml;base64,
    - key: basic-test-manager-case-statistics
      resource: combined-components
      name: 测试用例模块统计
      description: 统计测试用例模块的自动化率
      loadType: RemoteJs
      enableSave: true
      tabOrder: 1
      type: 自定义
      grid:
        w: 12
        h: 2
        minW: 1
        maxW: 12
        minH: 1
      icon: data:image/svg+xml;base64,
tables:
  - className: Repository
    fields:
      name:
        type: String
      workspaceKey:
        type: String
      parent:
        type: Pointer
        isAppClass: true
        targetClass: Repository
      # deprecated 使用 Test 表的 repository 替代
      # testDetailIds:
      #   type: Array
      ancestors:
        type: Array
      sortIndex:
        type: Number
  - className: TestConfig
    fields:
      workspaceKey:
        type: String
      isolateTestType:
        type: Array
      itemTypeMap:
        type: Object
      defectsMapping:
        type: Array
      testRunAction:
        type: Object
      global:
        type: Boolean
      extra:
        type: Object
      tableFields:
        type: Object
      # 关联的缺陷面板 pointer
      # defectBoard:
      #   type: Pointer
      #   targetClass: Board
      # 控制缺陷面板是否显示，默认为 true
      # displayDefectBoard:
      #   type: Boolean
      # 关联统计报表
      chartGroups:
        type: Object
  - className: TestRelation
    fields:
      from:
        type: Pointer
        isAppClass: true
        targetClass: Test
      to:
        type: Pointer
        isAppClass: true
        targetClass: Test
      createdBy:
        type: Pointer
        targetClass: _User
      updatedBy:
        type: Pointer
        targetClass: _User
      relationType:
        type: String
  - className: WordTemplate
    fields:
      name:
        type: String
      file:
        type: Object
      # enable:
      #   type: Boolean
      # command:
      #   type: Array
  - className: UserSetting
    fields:
      filterFields:
        type: Object
      workspace:
        type: Pointer
        targetClass: Workspace
      user:
        type: Pointer
        targetClass: _User
  - className: TestReport
    fields:
      name:
        type: String
      workspace:
        type: Pointer
        targetClass: Workspace
      chartGroup:
        type: Pointer
        targetClass: ChartGroup
      # 是否是测试报告模板 
      isTemplate:
        type: Boolean
      # 是否是租户级模板 
      isGlobalTemplate:
        type: Boolean
      # 是否是默认模板
      isDefaultTemplate:
        type: Boolean
      # 模板配置文件
      templateConfig:
        type: Object
      # 报告概览数据
      reportOverviewData:
        type: Object
      createdBy:
        type: Pointer
        targetClass: _User
      # 基于哪个模板生成
      usingReportTemplate:
        type: Pointer
        targetClass: test_manager_TestReport
      # 报告状态
      reportStatus:
        type: String
      # 测试报告doc path
      reportUrl:
        type: String
locales:
