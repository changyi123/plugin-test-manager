app:
  uuid: bf73e61c-e15a-4461-a1f7-f940c2009332
  name: test-manager
modules:
  trigger:
    - key: test-manager-initial-script
      events:
        - proxima:app:install
      function: test-manager-initial-script
  function:
      - key: test-manager-initial-script
      handler: /trigger/initialScript.js
  adminPage:
    - key: micro-adminPage-1
      resource: main
      title: 微应用test
      loadType: Micro
tables:
  - className: Repository
    fields:
      name:
        type: String
      workspace:
        type: Pointer
        targetClass: Workspace
      parent:
        type: Pointer
        targetClass: test_manager_Repository
      issues:
        type: Array
      tenant:
        type: Pointer
        targetClass: Tenant
      type:
        type: Number
  - className: TestConfig
    fields:
      workspace:
        type: Pointer
        targetClass: Workspace
      itemTypeMap:
        type: Object
  - className: TestStep
    fields:
      resource:
        type: String
      action:
        type: String
      data:
        type: String
      expectedResult:
        type: String
      attachments:
        type: Array
      customFileds:
        type: Object
      index:
        type: Number
      callTestIssueId:
        type: String
  - className: TestExecution
    fields:
      resource:
        type: String
      action:
        type: String
      data:
        type: String
      expectedResult:
        type: String
      attachments:
        type: Array
      customFileds:
        type: Object
      index:
        type: Number
      actualResult:
        type: String
      status:
        type: Number
      comment:
        type: String
      defects:
        type: Array
      evidence:
        type: Array
  - className: Activity
    fields:
      resource:
        type: String
      avatar:
        type: String
      log:
        type: String
      type:
        type: Number
      originValue:
        type: String
      newValue:
        type: String
