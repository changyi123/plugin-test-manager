app:
  uuid: bf73e61c-e15a-4461-a1f7-f940c2009332
  name: test-manager
modules:
  trigger:
    - key: test-manager-initial-script
      events:
        # 使用 update trigger 暂时替代
        # - proxima:app:install
        - proxima:app:install
      function: test-manager-initial-script
    - key: test-manager-update-script
      events:
        - proxima:app:update
      function: test-manager-initial-script
  function:
    - key: test-manager-initial-script
      handler: /trigger/initialScript.js
    - key: test-manager-validate-script
      handler: /trigger/validate.js
    - key: test-manager-import-script
      handler: /trigger/import.js
  itemPanel:
    - key: test-manager-test-detail
      resource: main
      title: 测试管理
      loadType: Micro
      route: /testPanel
  adminPage:
    - key: test-config
      resource: main
      title: 测试管理配置
      loadType: Micro
      route: /testConfig
  workspacePage:
    - key: test-plan
      resource: main
      title: 测试计划
      loadType: Micro
      route: /testPlan
    - key: test-repository
      resource: main
      title: 测试用例库
      loadType: Micro
      route: /testRepo
  beforeCreateOrUpdateModal:
    - key: before-create-or-update-modal
      resource: main
      title: 新建事项
      loadType: Micro
      route: /beforeItemCreate
  importAndExport:
    import: test-manager-import-script
    validate: test-manager-validate-script
    itemType:
      - key: group
        title: 所属分组
      # - key: name
      #   title: 用例标题
      # - key: priority
      #   title: 优先级
      - key: precondition
        title: 前置条件
      - key: action
        title: 步骤描述
      - key: result
        title: 预期结果
      - key: data
        title: 数据
tables:
  - className: Repository
    fields:
      name:
        type: String
      workspaceKey:
        type: String
      parent:
        type: Pointer
        isAppClass: true
        targetClass: Repository
      # 废弃暂时先不删
      # itemIds:
      #   type: Array
      testDetailIds:
        type: Array
      tenant:
        type: Pointer
        targetClass: Tenant
      type:
        type: Number
  - className: TestConfig
    fields:
      workspaceKey:
        type: String
      isolateTestType:
        type: Array
      itemTypeMap:
        type: Object
      defectsMapping:
        type: Array
      global:
        type: Boolean
      extra:
        type: Object
  - className: Test
    fields:
      reference:
        type: Pointer
        targetClass: Item
      workspaceKey:
        type: String
      type:
        type: String
      status:
        type: String

      runDetail:
        type: Object
      # 废弃， 使用 detail 字段替代
      steps:
        type: Array
      detail:
        type: Object
      runReferenceDetail:
        type: Pointer
        isAppClass: true
        targetClass: Test
  - className: Activity
    fields:
      resource:
        type: String
      avatar:
        type: String
      log:
        type: String
      type:
        type: Number
      originValue:
        type: String
      newValue:
        type: String
  - className: TestRelation
    fields:
      from:
        type: Pointer
        isAppClass: true
        targetClass: Test
      to:
        type: Pointer
        isAppClass: true
        targetClass: Test
      relationType:
        type: String
resources:
  - key: main
    path: ./dist/
