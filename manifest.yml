app:
  uuid: bf73e61c-e15a-4461-a1f7-f940c2009332
  name: test-manager
modules:
  # trigger:
  # - key: test-manager-initial-script
  #   events:
  #     - proxima:app:install
  #   function: test-manager-initial-script
  function:
    - key: test-manager-initial-script
      handler: /trigger/initialScript.js
  itemPanel:
    - key: test-manager-test-detail
      resource: main
      title: 测试管理
      loadType: Micro
      route: /testPanel
  adminPage:
    - key: test-manager-repository
  workspacePage:
    - key: test-repository
      resource: main
      title: 测试用例仓库
      loadType: Micro
      route: /testRepo
  adminPage:
    - key: test-config
      resource: main
      title: 测试管理配置
      loadType: Micro
      route: /testConfig
tables:
  - className: Repository
    fields:
      name:
        type: String
      workspaceKey:
        type: String
      parent:
        type: Pointer
        isAppClass: true
        targetClass: Repository
      itemIds:
        type: Array
      tenant:
        type: Pointer
        targetClass: Tenant
      type:
        type: Number
  - className: TestConfig
    fields:
      workspaceKey:
        type: String
      itemTypeMap:
        type: Object
      defectsMapping:
        type: Array
      global:
        type: Boolean
      extra:
        type: Object
  - className: Test
    fields:
      reference:
        type: Pointer
        targetClass: Item
      workspaceKey:
        type: String
      type:
        type: String
      status:
        type: String
      steps:
        type: Array
      runReferenceDetail:
        type: Pointer
        isAppClass: true
        targetClass: Test
      runDetail:
        type: Object
  - className: Activity
    fields:
      resource:
        type: String
      avatar:
        type: String
      log:
        type: String
      type:
        type: Number
      originValue:
        type: String
      newValue:
        type: String
  - className: TestRelation
    fields:
      from:
        type: Pointer
        isAppClass: true
        targetClass: Test
      to:
        type: Pointer
        isAppClass: true
        targetClass: Test
      relationType:
        type: String
resources:
  - key: main
    path: ./dist/
